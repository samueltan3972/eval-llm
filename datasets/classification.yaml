# Classification — reference-based single-label.
- description: "classify: sentiment positive"
  vars:
    question: "Classify the sentiment of this review as exactly one word: Positive, Negative, or Neutral.\nReview: 'Absolutely loved it — best purchase I've made all year!'\nReply with only the label."
  assert:
    - type: icontains
      value: "Positive"
  metadata: { domain: classification, tier: core }

- description: "classify: sentiment negative"
  vars:
    question: "Classify the sentiment of this review as exactly one word: Positive, Negative, or Neutral.\nReview: 'It broke after two days and support never replied.'\nReply with only the label."
  assert:
    - type: icontains
      value: "Negative"
  metadata: { domain: classification, tier: core }

- description: "classify: topic"
  vars:
    question: "Classify the topic of this headline as one of: Sports, Politics, Technology, Health.\nHeadline: 'New smartphone chip doubles battery life while cutting power draw.'\nReply with only the label."
  assert:
    - type: icontains
      value: "Technology"
  metadata: { domain: classification, tier: core }

- description: "classify: intent"
  vars:
    question: "Classify the user's intent as one of: Refund, Complaint, Question, Praise.\nMessage: 'How do I reset my password?'\nReply with only the label."
  assert:
    - type: icontains
      value: "Question"
  metadata: { domain: classification, tier: extended }

- description: "classify: NLI (entailment)"
  vars:
    question: "Given the premise and hypothesis, answer with exactly one of: Entailment, Contradiction, Neutral.\nPremise: 'A man is playing a guitar on stage.'\nHypothesis: 'A person is making music.'\nReply with only the label."
  assert:
    - type: icontains
      value: "Entailment"
  metadata: { domain: classification, tier: extended }
