# Instruction following — strict format/length/constraint adherence (deterministic checks).
- description: "ifeval: exact phrase only"
  vars:
    question: "Reply with exactly the phrase 'ACKNOWLEDGED' and nothing else — no punctuation, no explanation."
  assert:
    - type: regex
      value: "^\\s*ACKNOWLEDGED\\s*$"
  metadata: { domain: instruction_following, tier: core }

- description: "ifeval: word limit"
  vars:
    question: "Describe the ocean in 5 words or fewer. Reply with only the description."
  assert:
    - type: javascript
      value: |
        return output.trim().split(/\s+/).filter(Boolean).length <= 5;
  metadata: { domain: instruction_following, tier: core }

- description: "ifeval: forbidden word"
  vars:
    question: "Write one sentence about a sunny day WITHOUT using the letter 'e'. Reply with only the sentence."
  assert:
    - type: javascript
      value: |
        return !/e/i.test(output);
  metadata: { domain: instruction_following, tier: core }

- description: "ifeval: multi-constraint"
  vars:
    question: "Write exactly 3 sentences about space. Each sentence must contain exactly 10 words. Do not use the word 'star' or the word 'planet'. Reply with only the three sentences."
  assert:
    - type: javascript
      value: |
        const text = output.trim();
        const sentences = text.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0);
        if (sentences.length !== 3) return false;
        for (const s of sentences) {
          const words = s.trim().split(/\s+/).filter(Boolean);
          if (words.length < 9 || words.length > 11) return false;
        }
        if (/\bstar\b/i.test(text)) return false;
        if (/\bplanet\b/i.test(text)) return false;
        return true;
  metadata: { domain: instruction_following, tier: extended }

- description: "ifeval: nested JSON output"
  vars:
    question: 'Reply with ONLY a JSON object with this exact structure: {"user": {"name": "Alice", "role": "admin"}, "permissions": ["read", "write"]}. No prose, no markdown fences.'
  assert:
    - type: is-json
      value:
        type: object
        required: [user, permissions]
        properties:
          user:
            type: object
            required: [name, role]
            properties:
              name: { type: string }
              role: { type: string }
          permissions:
            type: array
            items: { type: string }
    - type: contains-json
      value:
        type: object
        properties:
          user:
            type: object
            properties:
              name: { const: "Alice" }
              role: { const: "admin" }
  metadata: { domain: instruction_following, tier: extended }
