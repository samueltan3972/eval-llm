- description: "codegen: fizzbuzz(n)"
  vars:
    question: "Write a JavaScript function named `fizzbuzz` that, given a single integer n, returns the string 'Fizz' if n is divisible by 3, 'Buzz' if divisible by 5, 'FizzBuzz' if divisible by both, otherwise the number as a string. Return only the function definition."
  assert:
    - type: javascript
      value: |
        const m = output.match(/```(?:javascript|js)?\s*([\s\S]*?)```/i);
        const code = (m ? m[1] : output).trim();
        let fn;
        try { fn = new Function(code + "\nreturn typeof fizzbuzz === 'function' ? fizzbuzz : null;")(); }
        catch (e) { return { pass:false, score:0, reason:'syntax error: ' + e.message }; }
        if (typeof fn !== 'function') return { pass:false, score:0, reason:'function `fizzbuzz` not found' };
        const ok = fn(3) === 'Fizz' && fn(5) === 'Buzz' && fn(15) === 'FizzBuzz' && String(fn(7)) === '7';
        return { pass: ok, score: ok?1:0, reason: ok ? 'executes correctly' : 'wrong output' };
  metadata: { domain: code_generation, tier: extended }

