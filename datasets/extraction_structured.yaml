# Structured extraction — JSON output validated against a schema + field checks.
- description: "extract: primary contact from multi-person text"
  vars:
    question: |
      Extract the PRIMARY contact's details into JSON with keys "name" (string), "email" (string),
      and "phone" (string). Reply with ONLY the JSON object, no markdown fences.
      Text: "For general questions reach out to the front desk (info@corp.io). Your account manager
      is Lisa Park (lisa.park@corp.io, 555-0142). Her assistant Tom can also help (tom.r@corp.io)."
  assert:
    - type: is-json
      value:
        type: object
        required: [name, email, phone]
        properties:
          name: { type: string }
          email: { type: string }
          phone: { type: string }
    - type: contains
      value: "lisa.park@corp.io"
  metadata: { domain: extraction_structured, tier: core }

- description: "extract: nested order with line_items"
  vars:
    question: |
      Extract the order into JSON with keys "order_id" (string), "customer" (string),
      and "line_items" (array of objects each with "product" (string), "quantity" (integer),
      and "unit_price" (number)). Reply with ONLY the JSON object, no markdown fences.
      Text: "Order #A-7821 for customer Raj Patel: 2x Bluetooth Speaker at $34.99 each and
      5x USB-C Cable at $8.50 each."
  assert:
    - type: is-json
      value:
        type: object
        required: [order_id, customer, line_items]
        properties:
          order_id: { type: string }
          customer: { type: string }
          line_items:
            type: array
            items:
              type: object
              required: [product, quantity, unit_price]
              properties:
                product: { type: string }
                quantity: { type: integer }
                unit_price: { type: number }
  metadata: { domain: extraction_structured, tier: core }

- description: "extract: messy informal text to meeting JSON"
  vars:
    question: |
      Extract the meeting details into JSON with keys "attendee" (string), "time" (string),
      "room" (string), "topic" (string), and "estimated_budget" (number).
      Reply with ONLY the JSON object, no markdown fences.
      Text: "mtg w/ Sarah @ 3pm tmrw, rm 204, re: Q4 budget — est. $45k"
  assert:
    - type: is-json
      value:
        type: object
        required: [attendee, time, room, topic, estimated_budget]
        properties:
          attendee: { type: string }
          time: { type: string }
          room: { type: string }
          topic: { type: string }
          estimated_budget: { type: number }
  metadata: { domain: extraction_structured, tier: core }

- description: "extract: updated/corrected price"
  vars:
    question: |
      Extract the CURRENT product listing into JSON with keys "product" (string),
      "original_price" (number), and "current_price" (number).
      Reply with ONLY the JSON object, no markdown fences.
      Text: "The ProMax Wireless Earbuds were originally listed at $89.99,
      now marked down to $62.99 for the summer sale."
  assert:
    - type: is-json
      value:
        type: object
        required: [product, original_price, current_price]
        properties:
          product: { type: string }
          original_price: { type: number }
          current_price: { type: number }
    - type: contains-json
      value:
        type: object
        properties:
          current_price: { const: 62.99 }
  metadata: { domain: extraction_structured, tier: extended }

- description: "extract: complex structure with optional fields and arrays"
  vars:
    question: |
      Extract the event into JSON with keys "event_name" (string), "date" (string),
      "location" (object with "venue" (string) and "city" (string)),
      "speakers" (array of objects each with "name" (string), "title" (string),
      and optionally "company" (string)),
      and optionally "registration_fee" (number, if mentioned).
      Reply with ONLY the JSON object, no markdown fences.
      Text: "Join us at DevSummit 2026 on August 15th at the Grand Convention Center, Austin.
      Speakers include Dr. Ana Ruiz (CTO, NovaTech) and Marcus Webb (Lead Engineer).
      Early-bird registration is $199."
  assert:
    - type: is-json
      value:
        type: object
        required: [event_name, date, location, speakers]
        properties:
          event_name: { type: string }
          date: { type: string }
          location:
            type: object
            required: [venue, city]
            properties:
              venue: { type: string }
              city: { type: string }
          speakers:
            type: array
            items:
              type: object
              required: [name, title]
              properties:
                name: { type: string }
                title: { type: string }
                company: { type: string }
          registration_fee: { type: number }
    - type: contains-json
      value:
        type: object
        properties:
          registration_fee: { const: 199 }
  metadata: { domain: extraction_structured, tier: extended }
