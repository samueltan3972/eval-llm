- description: "codegen: pipe(...fns)"
  vars:
    question: "Write a JavaScript function named `pipe` that takes any number of functions as arguments and returns a new function that applies them left-to-right (i.e., the output of each function is passed as input to the next). For example, `pipe(x => x + 1, x => x * 2)(3)` should return `8`. Return only the function definition."
  assert:
    - type: javascript
      value: |
        const m = output.match(/```(?:javascript|js)?\s*([\s\S]*?)```/i);
        const code = (m ? m[1] : output).trim();
        let fn;
        try { fn = new Function(code + "\nreturn typeof pipe === 'function' ? pipe : null;")(); }
        catch (e) { return { pass:false, score:0, reason:'syntax error: ' + e.message }; }
        if (typeof fn !== 'function') return { pass:false, score:0, reason:'function `pipe` not found' };
        const ok = fn(x => x + 1, x => x * 2)(3) === 8 && fn(x => x.toUpperCase())('hello') === 'HELLO';
