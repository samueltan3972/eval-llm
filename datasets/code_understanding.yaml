# Code understanding — explain, debug, predict output (deterministic check + LLM-judge).
- description: "code: closure/scoping puzzle"
  vars:
    question: |
      What does this JavaScript code print to the console? List each printed value on its own line, in the order they appear.
      ```js
      for (var i = 0; i < 3; i++) {
        setTimeout(() => console.log(i), 0);
      }
      ```
  assert:
    - type: javascript
      value: |
        const matches = output.match(/3/g);
        const ok = matches !== null && matches.length >= 3 && !/\b0\b/.test(output) && !/\b1\b/.test(output) && !/\b2\b/.test(output);
        return { pass: ok, score: ok?1:0, reason: ok ? 'correctly identifies that var scoping causes all three to print 3' : 'should print 3 three times, not 0,1,2 — var is function-scoped, not block-scoped' };
    - type: llm-rubric
      value: "Correctly identifies that `var` is function-scoped so by the time the setTimeout callbacks run, i is 3, and all three print 3 (not 0, 1, 2). Explanation demonstrates understanding of the event loop and closure over a shared variable."
  metadata: { domain: code_understanding, tier: core }

- description: "code: find subtle bug in binary search"
  vars:
    question: |
      The function below has a subtle bug that causes it to fail on some inputs. Identify the bug and explain how to fix it in one or two sentences.
      ```js
      function binarySearch(arr, target) {
        let lo = 0, hi = arr.length;
        while (lo < hi) {
          const mid = (lo + hi) >>> 1;
          if (arr[mid] === target) return mid;
          if (arr[mid] < target) lo = mid + 1;
          else hi = mid - 1;
        }
        return -1;
      }
      ```
  assert:
    - type: llm-rubric
      value: "Identifies the inconsistency between the half-open upper bound (hi = arr.length, lo < hi) and the closed-bound update (hi = mid - 1). With a half-open upper bound, the else branch should set hi = mid (not mid - 1), otherwise elements can be skipped. Alternatively, the code could use hi = arr.length - 1 with lo <= hi. The model must identify this mismatch as the root cause, not just state a generic off-by-one."
  metadata: { domain: code_understanding, tier: core }

- description: "code: time complexity of memoized recursion"
  vars:
    question: |
      What is the time complexity (Big-O) of this function in terms of n? Reply with only the Big-O expression.
      ```js
      function fib(n, memo = {}) {
        if (n <= 1) return n;
        if (memo[n] !== undefined) return memo[n];
        memo[n] = fib(n - 1, memo) + fib(n - 2, memo);
        return memo[n];
      }
      ```
  assert:
    - type: javascript
      value: |
        const ok = /O\s*\(\s*n\s*\)/i.test(output) && !/n\s*[\^²2]/i.test(output) && !/2\s*\^\s*n/i.test(output);
        return { pass: ok, score: ok?1:0, reason: ok ? 'correctly identifies O(n)' : 'should be O(n) due to memoization, not exponential' };
    - type: llm-rubric
      value: "Correctly identifies the time complexity as O(n). The memoization ensures each value from 0 to n is computed only once, reducing the exponential tree to linear."
  metadata: { domain: code_understanding, tier: core }

- description: "code: identify security vulnerability"
  vars:
    question: |
      Identify the security vulnerability in this Node.js Express route handler. Name the vulnerability type and explain how an attacker could exploit it.
      ```js
      app.get('/user', (req, res) => {
        const userId = req.query.id;
        const query = `SELECT * FROM users WHERE id = '${userId}'`;
        db.query(query, (err, results) => {
          res.send(`<h1>Profile</h1><p>Welcome, ${results[0].name}</p>`);
        });
      });
      ```
  assert:
    - type: llm-rubric
      value: "Identifies SQL injection via unsanitized userId interpolated directly into the query string (e.g., attacker could pass id=1' OR '1'='1). Should also ideally identify the reflected XSS vulnerability where results[0].name is injected directly into HTML without escaping. Must mention at least the SQL injection."
  metadata: { domain: code_understanding, tier: extended }

- description: "code: deduce what recursive function computes"
  vars:
    question: |
      What does this function compute? State what `g(4, 3)` returns and explain in one sentence what `g(a, b)` computes in general.
      ```js
      function g(a, b) {
        if (b === 0) return 0;
        return a + g(a, b - 1);
      }
      ```
  assert:
    - type: javascript
      value: |
        const has12 = /12/.test(output);
        const hasMult = /multipli|product|\*|times/i.test(output);
        const ok = has12 && hasMult;
        return { pass: ok, score: ok?1:0, reason: ok ? 'correctly identifies multiplication and g(4,3)=12' : 'should identify g(a,b) as multiplication (a*b) with g(4,3)=12' };
    - type: llm-rubric
      value: "Correctly states that g(4, 3) returns 12 and explains that g(a, b) computes multiplication (a * b) via repeated addition."
  metadata: { domain: code_understanding, tier: extended }
