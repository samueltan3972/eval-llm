# Code generation — the javascript assertion actually executes the generated function.
# Each prompt asks for a single named JS function; the assertion strips any code fences,
# instantiates the function, and runs real test inputs against expected outputs.
- description: "codegen: add(a, b)"
  vars:
    question: "Write a JavaScript function named `add` that takes two numbers and returns their sum. Return only the function definition (a code block is fine)."
  assert:
    - type: javascript
      value: |
        const m = output.match(/```(?:javascript|js)?\s*([\s\S]*?)```/i);
        const code = (m ? m[1] : output).trim();
        let fn;
        try { fn = new Function(code + "\nreturn typeof add === 'function' ? add : null;")(); }
        catch (e) { return { pass:false, score:0, reason:'syntax error: ' + e.message }; }
        if (typeof fn !== 'function') return { pass:false, score:0, reason:'function `add` not found' };
        const ok = fn(2,3) === 5 && fn(-1,1) === 0 && fn(0,0) === 0;
        return { pass: ok, score: ok?1:0, reason: ok ? 'executes correctly' : 'wrong output' };
    - type: llm-rubric
      value: "The function is clean and correct JavaScript for adding two numbers."
  metadata: { domain: code_generation, tier: core }

