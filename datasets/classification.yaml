# Classification — reference-based single-label.
- description: "classify: sarcastic sentiment"
  vars:
    question: "Classify the sentiment as exactly one word: Positive, Negative, or Neutral.\nText: 'Oh wonderful, my flight got cancelled and I spent five extra hours at the airport. Best day ever.'\nReply with only the label."
  assert:
    - type: icontains
      value: "Negative"
  metadata: { domain: classification, tier: core }

- description: "classify: mixed sentiment"
  vars:
    question: "Classify the overall sentiment as exactly one word: Positive, Negative, or Neutral.\nReview: 'The camera quality is stunning but the battery barely lasts two hours and customer support was unhelpful.'\nReply with only the label."
  assert:
    - type: icontains
      value: "Negative"
  metadata: { domain: classification, tier: core }

- description: "classify: cross-domain topic"
  vars:
    question: "Classify the topic of this headline as one of: Sports, Politics, Technology, Health.\nHeadline: 'CRISPR gene therapy trial shows promising results for treating hereditary blindness in children'\nReply with only the label."
  assert:
    - type: icontains
      value: "Health"
  metadata: { domain: classification, tier: core }

- description: "classify: implicit intent"
  vars:
    question: "Classify the user's intent as one of: Question, Complaint, Praise, Cancellation.\nMessage: 'I placed my order three weeks ago and it still hasn't shipped.'\nReply with only the label."
  assert:
    - type: icontains
      value: "Complaint"
  metadata: { domain: classification, tier: extended }

- description: "classify: NLI tricky neutral"
  vars:
    question: "Given the premise and hypothesis, answer with exactly one of: Entailment, Contradiction, Neutral.\nPremise: 'Students who exercise regularly tend to score higher on standardized tests.'\nHypothesis: 'Exercise directly improves test scores.'\nReply with only the label."
  assert:
    - type: icontains
      value: "Neutral"
  metadata: { domain: classification, tier: extended }
