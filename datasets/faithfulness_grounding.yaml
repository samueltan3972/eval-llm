# Faithfulness / grounding — answer ONLY from provided context; admit when unknown.
- description: "grounding: answer present in context"
  vars:
    question: |
      Using ONLY the context, answer the question.
      Context: "Acme Corp was founded in 2011 in Berlin and employs 240 people across 3 offices."
      Question: In which city was Acme Corp founded? Reply with only the city.
  assert:
    - type: icontains
      value: "Berlin"
  metadata: { domain: faithfulness_grounding, tier: core }

- description: "grounding: refuse when not in context"
  vars:
    question: |
      Using ONLY the context, answer the question. If the answer is not in the context, reply
      exactly "I don't know".
      Context: "Acme Corp was founded in 2011 in Berlin and employs 240 people across 3 offices."
      Question: Who is the CEO of Acme Corp?
  assert:
    - type: icontains
      value: "I don't know"
  metadata: { domain: faithfulness_grounding, tier: core }

- description: "grounding: no hallucinated numbers"
  vars:
    question: |
      Using ONLY the context, answer the question. If the answer is not in the context, say so.
      Context: "The 2023 survey covered 1,200 respondents in five countries. 62% preferred
      option A."
      Question: What percentage preferred option B? Answer in one short sentence.
  assert:
    - type: llm-rubric
      value: "States the context does not give option B's percentage (does NOT fabricate 38% or any other number as if stated). Noting 38% only as an inference from 62% is acceptable if clearly labeled as inferred."
  metadata: { domain: faithfulness_grounding, tier: extended }

- description: "grounding: contradiction resistance"
  vars:
    question: |
      Using ONLY the context, answer the question.
      Context: "The library is open Monday to Friday, 9am-5pm. It is closed on weekends."
      Question: Is the library open on Sunday? Answer 'Yes' or 'No' and quote the relevant phrase.
  assert:
    - type: regex
      value: "(?i)\\bno\\b"
    - type: llm-rubric
      value: "Answers No and references that the library is closed on weekends."
  metadata: { domain: faithfulness_grounding, tier: extended }
